[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1B2340"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#E6EAEF"
textColor = "#1B2340"
linkColor = "#1B2340"
borderColor = "#D3D8E0"
redColor = "#B3123A"
greenColor = "#1F7A6D"
grayColor = "#5B6475"
font = "Atkinson Hyperlegible:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&display=swap"
codeFont = "Atkinson Hyperlegible:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 16
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
chartCategoricalColors = ["#B3123A", "#1F7A6D", "#5B6475"]

[theme.sidebar]
backgroundColor = "#E9EDF1"
