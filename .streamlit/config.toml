[client]
# Demo mode: no developer menu, no Deploy button, no error tracebacks for the audience
toolbarMode = "viewer"
showSidebarNavigation = false
showErrorDetails = "none"

[ui]
hideTopBar = true

[server]
runOnSave = false
# Fonts are served from app/static/fonts so the app runs with no internet
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1B2340"
backgroundColor = "#F3F5F7"
secondaryBackgroundColor = "#E6EAEF"
textColor = "#1B2340"
linkColor = "#1B2340"
borderColor = "#D3D8E0"
redColor = "#B3123A"
greenColor = "#1F7A6D"
grayColor = "#5B6475"
font = "Atkinson Hyperlegible"
headingFont = "Bricolage Grotesque"
codeFont = "Atkinson Hyperlegible"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseFontSize = 16
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
chartCategoricalColors = ["#B3123A", "#1F7A6D", "#5B6475"]

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/AtkinsonHyperlegible-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "app/static/fonts/AtkinsonHyperlegible-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/BricolageGrotesque-VF.ttf"
weight = "200 800"

[theme.sidebar]
backgroundColor = "#E9EDF1"
